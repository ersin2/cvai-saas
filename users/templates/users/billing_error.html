{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing Portal | CVAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'generator/css/cvai-global.css' %}">
    <style>
        body {
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-card {
            background: rgba(12, 16, 34, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #a855f7;
            margin: 0 auto 24px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.2);
        }
        .error-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: white;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }
        .error-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn-return {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            border: none;
            color: white;
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(124, 58, 237, 0.3);
        }
        .btn-return:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(124, 58, 237, 0.4);
            color: white;
        }
    </style>
</head>
<body>

    <div class="error-card">
        <div class="icon-circle">
            <i class="fas fa-file-invoice"></i>
        </div>
        <h2 class="error-title">No Billing Account Found</h2>
        <p class="error-desc">
            We couldn't find an active Stripe subscription for your account. If you were manually upgraded to Pro or Elite by an administrator, there is no Stripe billing portal to manage.
        </p>
        <a href="{% url 'profile' %}" class="btn-return">
            <i class="fas fa-arrow-left"></i> Return to Profile
        </a>
    </div>

</body>
</html>
