{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing Portal | CVAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'generator/css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'generator/css/cvai-global.css' %}">
    <style>
        body {
            background: var(--paper);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-card {
            background: var(--paper-raised);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--rule);
            border-radius: var(--r-xl);
            padding: 50px 40px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 30px 60px rgba(20, 18, 14, 0.12), inset 0 1px 0 transparent;
            animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background: var(--accent-tint);
            border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--rule));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--accent);
            margin: 0 auto 24px;
            box-shadow: none;
        }
        .error-title {
            font-size: 1.9rem;
            font-weight: 400;
            color: var(--ink);
            margin-bottom: 16px;
            letter-spacing: -0.5px; font-family: var(--serif); letter-spacing: -0.02em; }
        .error-desc {
            color: var(--text-2);
            font-size: var(--fs-md);
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn-return {
            background: var(--ink);
            border: none;
            color: var(--paper);
            padding: 14px 32px;
            border-radius: var(--r-pill);
            font-weight: 500;
            font-size: var(--fs-md);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: none;
        }
        .btn-return:hover {
            transform: translateY(-2px);
            box-shadow: none;
            color: var(--paper); background: var(--accent);
        }
    </style>
</head>
<body>

    <div class="error-card">
        <div class="icon-circle">
            <i class="fas fa-file-invoice"></i>
        </div>
        <h2 class="error-title">No Billing Account Found</h2>
        <p class="error-desc">
            We couldn't find an active Stripe subscription for your account. If you were manually upgraded to Pro or Elite by an administrator, there is no Stripe billing portal to manage.
        </p>
        <a href="{% url 'profile' %}" class="btn-return">
            <i class="fas fa-arrow-left"></i> Return to Profile
        </a>
    </div>

</body>
</html>
