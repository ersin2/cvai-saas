# ── Redis (shared cache + rate-limiter backend) ───────────────────────────
redis:
  - name: mysite-redis
    plan: free

databases:
  - name: mysitedb
    databaseName: mysite
    user: mysite
    plan: free

services:
  # ── Django web (ASGI) ─────────────────────────────────────────────────────
  - type: web
    name: mysite
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    # ASGI worker — migrate first (DB is only reachable at runtime, not during build)
    startCommand: "python manage.py migrate --no-input && gunicorn aigen.asgi:application -k uvicorn.workers.UvicornWorker --workers 4 --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mysitedb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: ALLOWED_HOSTS
        value: "*"
      # Anthropic — Django calls the API directly (generator/ai_client.py).
      # Required: there is no other path to a provider. A FastAPI worker used
      # to sit in between, but this plan has no private networking, so its
      # internal address did not resolve and its public URL was rate-limited
      # by the platform edge. The worker has been removed.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: "claude-sonnet-5"

      - key: REDIS_URL
        fromService:
          name: mysite-redis
          type: redis
          property: connectionString
      # Stripe (set manually in Render dashboard)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      - key: STRIPE_PRICE_ID_ELITE
        sync: false
      # Sentry (set manually in Render dashboard)
      - key: SENTRY_DSN
        sync: false
      # Custom domain fallback for CSRF_TRUSTED_ORIGINS (optional)
      - key: APP_URL
        sync: false
