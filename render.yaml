# ── Redis (shared cache + rate-limiter backend) ───────────────────────────
redis:
  - name: mysite-redis
    plan: free

databases:
  - name: mysitedb
    databaseName: mysite
    user: mysite
    plan: free

services:
  # ── Django web (ASGI) ─────────────────────────────────────────────────────
  - type: web
    name: mysite
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    # ASGI worker — migrate first (DB is only reachable at runtime, not during build)
    startCommand: "python manage.py migrate --no-input && gunicorn aigen.asgi:application -k uvicorn.workers.UvicornWorker --workers 4 --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mysitedb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: ALLOWED_HOSTS
        value: "*"
      # Point Django at the FastAPI AI service deployed on Render
      # Set this to the actual URL of your ai_worker service after deploying it
      - key: AI_SERVICE_URL
        # Private-network URL — only reachable inside Render's internal network
        value: "http://ai-worker:10000"
      - key: REDIS_URL
        fromService:
          name: mysite-redis
          type: redis
          property: connectionString
      # Stripe (set manually in Render dashboard)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      - key: STRIPE_PRICE_ID_ELITE
        sync: false
      # Sentry (set manually in Render dashboard)
      - key: SENTRY_DSN
        sync: false
      # Custom domain fallback for CSRF_TRUSTED_ORIGINS (optional)
      - key: APP_URL
        sync: false

  # ── FastAPI AI worker ─────────────────────────────────────────────────────
  - type: pserv
    name: ai-worker
    plan: free
    runtime: python
    rootDir: ai_service
    buildCommand: "pip install -r requirements-ai.txt"
    # Private services always bind on port 10000 — do NOT use $PORT
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false