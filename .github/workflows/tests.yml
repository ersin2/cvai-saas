# Runs the test suite on every push and pull request.
#
# Why this exists: the 115 tests only ever ran when someone remembered to run
# them. Two bugs reached production that the suite would have caught on push —
# an `effort` parameter that Haiku 4.5 rejects with a 400, and a provider
# routing change that 429'd every generation. Neither was noticed until users
# hit it.
#
# Deliberately does NOT deploy. Render deploys from main on its own; this job
# only reports pass/fail so a red main is visible.

name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch makes an in-flight run irrelevant.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Render runtime. Pinned rather than "3.x" so CI cannot
          # start passing on a version production does not run.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for missing migrations
        # Catches a model edited without makemigrations, which deploys fine and
        # then fails at runtime against the real database.
        env:
          SECRET_KEY: ci-only-not-a-real-secret
          DJANGO_SETTINGS_MODULE: aigen.settings
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        env:
          SECRET_KEY: ci-only-not-a-real-secret
          DJANGO_SETTINGS_MODULE: aigen.settings
          # No provider keys are set on purpose: the suite must not make a
          # billable API call, and any test that would silently start talking to
          # a real provider should fail here rather than in production.
        run: python manage.py test generator users tests --verbosity 2
