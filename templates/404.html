{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | CVAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'generator/css/icons.css' %}">
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2314120E'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia,serif' font-size='17' fill='%23FAF8F3'>CV</text></svg>">
    <link rel="stylesheet" href="{% static 'generator/css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'generator/css/cvai-global.css' %}?v=4">
    <style>
        body {
            background-color: var(--bg);
            font-family: var(--sans);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                none;
        }

        .error-container {
            text-align: center;
            max-width: 520px;
            padding: 40px 20px;
        }

        .error-code {
            
            font-size: clamp(6rem, 18vw, 10rem);
            font-weight: 400;
            line-height: 1;
            
            
            
            
            margin-bottom: 16px; font-family: var(--serif); letter-spacing: -0.02em; }

        .error-title {
            font-size: 2.2rem;
            font-weight: 400;
            color: var(--ink);
            margin-bottom: 12px; font-family: var(--serif); letter-spacing: -0.02em; }

        .error-desc {
            color: var(--text-2);
            font-size: var(--fs-md);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn-home {
            background: var(--ink);
            border: none;
            color: var(--paper);
            padding: 14px 36px;
            border-radius: var(--r-md);
            font-weight: 500;
            font-size: var(--fs-md);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: none;
            color: var(--paper); background: var(--accent);
        }

        .links-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 24px;
        }

        .links-row a {
            color: var(--text-3);
            text-decoration: none;
            font-size: var(--fs-base);
            transition: 0.2s;
        }

        .links-row a:hover {
            color: var(--brand);
        }

        .error-icon {
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="error-icon"><i class="fas fa-ghost"></i></div>
        <div class="error-code">404</div>
        <div class="error-title">Page Not Found</div>
        <div class="error-desc">The page you're looking for doesn't exist or has been moved. Let's get you back on
            track.</div>
        <a href="/" class="btn-home"><i class="fas fa-home"></i> Back to Home</a>
        <div class="links-row">
            <a href="/dashboard/">Dashboard</a>
            <a href="/tools/">AI Tools</a>
            <a href="/tracker/">Tracker</a>
        </div>
    </div>
</body>

</html>
