{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error | CVAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23080c14'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='monospace' font-weight='700' font-size='18' fill='%234cc9f0'>CV</text></svg>">
    <link rel="stylesheet" href="{% static 'generator/css/cvai-global.css' %}">
    <style>
        :root {
            --primary: #4cc9f0;
            --secondary: #f72585;
            --dark-bg: #0a0e17;
        }

        body {
            background-color: var(--dark-bg);
            font-family: 'Outfit', sans-serif;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(247, 37, 133, 0.08) 0%, transparent 50%);
        }

        .error-container {
            text-align: center;
            max-width: 520px;
            padding: 40px 20px;
        }

        .error-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 8rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #f72585, #ff6b6b);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 12px;
        }

        .error-desc {
            color: #64748b;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn-home {
            background: linear-gradient(135deg, #f72585, #4361ee);
            border: none;
            color: white;
            padding: 14px 36px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(247, 37, 133, 0.3);
            color: white;
        }

        .error-icon {
            font-size: 3rem;
            color: rgba(247, 37, 133, 0.2);
            margin-bottom: 20px;
        }

        .retry-text {
            color: #475569;
            font-size: 0.88rem;
            margin-top: 24px;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="error-icon"><i class="fas fa-triangle-exclamation"></i></div>
        <div class="error-code">500</div>
        <div class="error-title">Something Went Wrong</div>
        <div class="error-desc">Our servers are having a moment. This is usually temporary — please try again in a few
            seconds.</div>
        <a href="/" class="btn-home"><i class="fas fa-rotate-right"></i> Try Again</a>
        <div class="retry-text">If this keeps happening, our team has been notified.</div>
    </div>
</body>

</html>
