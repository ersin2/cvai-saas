<!-- Resume Studio Scripts — Unified A4 Visual Builder -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
// RESUME STUDIO — Reactive State + Canvas Binding
// ═══════════════════════════════════════════════════════════════

// State object — single source of truth
const RS = {
    full_name: '', target_role: '', email: '', phone: '',
    location: '', linkedin: '', summary: '',
    experience: [], skills: [], education: [], languages: [],
    _currentTpl: 'tpl-classic-navy'
};

// ── Sync: left panel field → state → canvas ──────────────────
function syncToCanvas(field, value) {
    RS[field] = value;
    renderCanvas();
}

// ── Render the A4 canvas from state ──────────────────────────
function renderCanvas() {
    const tpl = RS._currentTpl;
    const isSidebar = (tpl === 'tpl-classic-navy');
    const isCreative = (tpl === 'tpl-creative');
    const isTech = (tpl === 'tpl-tech-startup');

    // Name & role
    document.getElementById('cvName').textContent = RS.full_name || 'Your Name';
    document.getElementById('cvRole').textContent = RS.target_role || 'Professional Title';

    // Sidebar contacts
    document.getElementById('cvLocation').textContent = RS.location || '';
    document.getElementById('cvEmail').textContent = RS.email || '';
    document.getElementById('cvPhone').textContent = RS.phone || '';
    document.getElementById('cvLinkedin').textContent = RS.linkedin || '';

    // Inline contact row (non-sidebar templates)
    const contactRow = document.getElementById('cvContactRow');
    const contactParts = [RS.email, RS.phone, RS.location, RS.linkedin].filter(Boolean);
    if (!isSidebar && contactParts.length > 0) {
        const sep = isTech ? ' | ' : '  ·  ';
        contactRow.textContent = contactParts.join(sep);
        contactRow.style.display = 'block';
    } else {
        contactRow.style.display = isSidebar ? 'none' : 'block';
    }

    // Summary
    const summaryEl = document.getElementById('cvSummary');
    if (RS.summary) {
        summaryEl.textContent = RS.summary;
        summaryEl.classList.remove('cv-placeholder');
    }

    // Experience
    const expWrap = document.getElementById('cvExperience');
    if (RS.experience.length > 0) {
        expWrap.innerHTML = RS.experience.map((exp, i) => `
            <div style="margin-bottom:12px;" data-exp-idx="${i}">
                <div class="cv-exp-title" contenteditable="true" data-exp="${i}" data-key="title">${exp.title || ''}</div>
                <div style="display:flex; justify-content:space-between; align-items:baseline;">
                    <div class="cv-exp-company" contenteditable="true" data-exp="${i}" data-key="company">${exp.company || ''}</div>
                    <div class="cv-exp-dates" contenteditable="true" data-exp="${i}" data-key="dates">${exp.dates || ''}</div>
                </div>
                ${(exp.bullets || []).map((b, bi) => `<div class="cv-exp-bullet" contenteditable="true" data-exp="${i}" data-bullet="${bi}">${b}</div>`).join('')}
            </div>
        `).join('');
    }

    // Skills — sidebar bars vs inline
    const skillBars = document.getElementById('cvSkillBars');
    const skillsInlineWrap = document.getElementById('cvSkillsInlineWrap');
    const skillsInline = document.getElementById('cvSkillsInline');

    if (isSidebar) {
        skillBars.innerHTML = RS.skills.map(s => `
            <div class="cv-skill-bar-wrap">
                <div class="cv-skill-name">${s.name}</div>
                <div class="cv-skill-track"><div class="cv-skill-fill" style="width:${s.level}%"></div></div>
            </div>
        `).join('');
        skillsInlineWrap.style.display = 'none';
    } else if (isTech || isCreative) {
        skillsInlineWrap.style.display = 'block';
        skillsInline.innerHTML = RS.skills.map(s => `
            <div class="cv-skill-bar-wrap">
                <div class="cv-skill-name">${s.name}</div>
                <div class="cv-skill-track"><div class="cv-skill-fill" style="width:${s.level}%"></div></div>
            </div>
        `).join('');
    } else {
        skillsInlineWrap.style.display = RS.skills.length > 0 ? 'block' : 'none';
        skillsInline.innerHTML = RS.skills.map(s => `<span>${s.name}</span>`).join('  ·  ');
    }

    // Education
    const eduWrap = document.getElementById('cvEducation');
    const eduTitle = document.getElementById('cvEduTitle');
    if (RS.education.length > 0) {
        eduTitle.style.display = 'block';
        eduWrap.innerHTML = RS.education.map(ed => `
            <div style="margin-bottom:8px;">
                <div class="cv-exp-title" contenteditable="true">${ed.degree || ''}</div>
                <div style="display:flex; justify-content:space-between;">
                    <div class="cv-exp-company" contenteditable="true">${ed.school || ''}</div>
                    <div class="cv-exp-dates" contenteditable="true">${ed.dates || ''}</div>
                </div>
            </div>
        `).join('');
    } else {
        eduTitle.style.display = 'none';
    }

    // Languages
    const langArr = Array.isArray(RS.languages) ? RS.languages : [];
    const langText = langArr.join(', ');
    document.getElementById('cvLanguages').textContent = langText;
    const langInlineWrap = document.getElementById('cvLangInlineWrap');
    const langInline = document.getElementById('cvLangInline');
    if (!isSidebar && langArr.length > 0) {
        langInlineWrap.style.display = 'block';
        langInline.textContent = langText;
    } else {
        langInlineWrap.style.display = 'none';
    }

    // Sync quick-edit fields
    syncQuickEdit();
    renderSkillsEditor();
}

// ── Sync state → quick edit panel ────────────────────────────
function syncQuickEdit() {
    const map = { qeFullName: 'full_name', qeRole: 'target_role', qeEmail: 'email',
                  qePhone: 'phone', qeLocation: 'location', qeLinkedin: 'linkedin', qeSummary: 'summary' };
    for (const [id, key] of Object.entries(map)) {
        const el = document.getElementById(id);
        if (el && el !== document.activeElement) el.value = RS[key] || '';
    }
}

// ── Skills editor rendering ──────────────────────────────────
function renderSkillsEditor() {
    const list = document.getElementById('studioSkillsList');
    if (!list) return;
    list.innerHTML = RS.skills.map((s, i) => `
        <div class="skill-edit-row" data-idx="${i}">
            <input type="text" value="${s.name}" oninput="updateStudioSkill(${i}, 'name', this.value)">
            <input type="range" min="0" max="100" value="${s.level}" oninput="updateStudioSkill(${i}, 'level', parseInt(this.value))">
            <span class="skill-pct">${s.level}%</span>
            <button type="button" class="btn-del-skill" onclick="removeStudioSkill(${i})"><i class="fas fa-times"></i></button>
        </div>
    `).join('');
}

function addStudioSkill(name, level) {
    RS.skills.push({ name: name || 'New Skill', level: level || 50 });
    renderCanvas();
}
function updateStudioSkill(idx, key, val) {
    RS.skills[idx][key] = val;
    renderCanvas();
}
function removeStudioSkill(idx) {
    RS.skills.splice(idx, 1);
    renderCanvas();
}

// ── Template switching ───────────────────────────────────────
function switchTpl(btn) {
    const tpl = btn.dataset.tpl;
    RS._currentTpl = tpl;
    const paper = document.getElementById('a4Paper');
    paper.className = 'a4-paper ' + tpl;

    const sidebar = document.getElementById('cvSidebar');
    const headerBand = document.getElementById('cvHeaderBand');
    const accentBar = document.getElementById('cvAccentBar');
    const accentBottom = document.getElementById('cvAccentBarBottom');

    sidebar.style.display = (tpl === 'tpl-classic-navy') ? 'block' : 'none';

    const cvName = document.getElementById('cvName');
    const cvRole = document.getElementById('cvRole');
    const cvContactRow = document.getElementById('cvContactRow');
    const cvMain = document.getElementById('cvMain');

    if (tpl === 'tpl-creative') {
        headerBand.style.display = 'block';
        accentBottom.style.display = 'block';
        headerBand.innerHTML = '';
        headerBand.appendChild(cvName);
        headerBand.appendChild(cvRole);
        headerBand.appendChild(cvContactRow);
    } else {
        headerBand.style.display = 'none';
        accentBottom.style.display = 'none';
        cvMain.insertBefore(cvContactRow, cvMain.firstChild);
        cvMain.insertBefore(cvRole, cvMain.firstChild);
        cvMain.insertBefore(cvName, cvMain.firstChild);
    }

    accentBar.style.display = (tpl === 'tpl-tech-startup') ? 'block' : 'none';

    const dividers = paper.querySelectorAll('.cv-section-divider');
    dividers.forEach(d => d.style.display = (tpl === 'tpl-executive') ? 'block' : 'none');

    document.querySelectorAll('.tpl-pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');

    renderCanvas();
}

// ── AI Auto-Fill ─────────────────────────────────────────────
async function studioAiFill() {
    const btn = document.getElementById('studioAiBtn');
    const overlay = document.getElementById('loadingOverlay');
    const bar = document.getElementById('loadingBar');
    const pct = document.getElementById('loadingPercent');
    const step = document.getElementById('loadingStep');

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>AI is working...';
    overlay.classList.add('active');

    const steps = [
        { at: 8, msg: 'Analyzing your career data...' },
        { at: 25, msg: 'Extracting key achievements...' },
        { at: 48, msg: 'Building resume structure...' },
        { at: 68, msg: 'Optimizing for ATS...' },
        { at: 82, msg: 'Structuring JSON output...' },
        { at: 90, msg: 'Almost ready...' },
    ];
    let progress = 0;
    const interval = setInterval(() => {
        progress += Math.random() * 2.5 + 0.3;
        if (progress >= 92) { progress = 92; clearInterval(interval); }
        bar.style.width = progress + '%';
        pct.textContent = Math.floor(progress) + '%';
        for (let i = steps.length - 1; i >= 0; i--) {
            if (progress >= steps[i].at) {
                if (step.textContent !== steps[i].msg) {
                    step.style.opacity = '0';
                    setTimeout(() => { step.textContent = steps[i].msg; step.style.opacity = '1'; }, 200);
                }
                break;
            }
        }
    }, 280);

    try {
        const form = document.getElementById('studioAiForm');
        const resp = await fetch('{% url "generate_resume" %}', {
            method: 'POST',
            body: new FormData(form),
        });
        clearInterval(interval);

        if (resp.status === 429) {
            let msg = 'Too many requests. Please wait a minute.';
            try { const d = await resp.json(); msg = d.error || msg; } catch(e) {}
            resetStudioBtn(btn, overlay, bar, pct);
            showToast(msg, 'warning');
            return;
        }

        const data = await resp.json();

        bar.style.width = '100%';
        pct.textContent = '100%';
        step.textContent = 'Done!';

        setTimeout(() => {
            resetStudioBtn(btn, overlay, bar, pct);

            if (data.error) {
                showToast(data.error, 'danger');
                return;
            }

            if (data.resume) {
                const r = data.resume;

                if (r._raw) {
                    showToast('AI returned text instead of JSON. Displaying raw output.', 'warning');
                    RS.summary = r._raw;
                    renderCanvas();
                    showEditPanels();
                    return;
                }

                RS.full_name = r.full_name || '';
                RS.target_role = r.target_role || '';
                RS.email = r.email || '';
                RS.phone = r.phone || '';
                RS.location = r.location || '';
                RS.linkedin = r.linkedin || '';
                RS.summary = r.summary || '';
                RS.experience = Array.isArray(r.experience) ? r.experience : [];
                RS.skills = Array.isArray(r.skills) ? r.skills.map(s => ({
                    name: s.name || '',
                    level: typeof s.level === 'number' ? s.level : 50
                })) : [];
                RS.education = Array.isArray(r.education) ? r.education : [];
                RS.languages = Array.isArray(r.languages) ? r.languages : [];

                renderCanvas();
                showEditPanels();
                showToast('Resume generated! Edit inline on the canvas or use Quick Edit.', 'success');

                if (window.innerWidth < 1100) {
                    document.querySelector('.studio-right').scrollIntoView({ behavior: 'smooth' });
                }
            }
        }, 500);
    } catch (err) {
        clearInterval(interval);
        resetStudioBtn(btn, overlay, bar, pct);
        showToast('Connection failed. Is the AI service running?', 'danger');
    }
}

function resetStudioBtn(btn, overlay, bar, pct) {
    overlay.classList.remove('active');
    bar.style.width = '0%';
    pct.textContent = '0%';
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sparkles me-2"></i>Auto-Fill & Enhance with AI';
}

function showEditPanels() {
    document.getElementById('studioEditPanel').style.display = 'block';
    document.getElementById('studioSkillsPanel').style.display = 'block';
}

// ── PDF Upload handler ───────────────────────────────────────
function handleStudioPdfUpload(input) {
    const file = input.files[0];
    if (!file) return;
    if (!file.name.toLowerCase().endsWith('.pdf')) {
        showToast('Only PDF files are supported.', 'warning');
        input.value = '';
        return;
    }
    if (file.size > 5 * 1024 * 1024) {
        showToast('File too large. Maximum 5MB.', 'warning');
        input.value = '';
        return;
    }

    const label = document.getElementById('studioPdfLabel');
    label.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Extracting text...';

    const formData = new FormData();
    formData.append('pdf_file', file);

    fetch('{% url "parse_resume_pdf" %}', {
        method: 'POST',
        headers: { 'X-CSRFToken': '{{ csrf_token }}' },
        body: formData
    })
    .then(r => r.json())
    .then(data => {
        if (data.text) {
            document.getElementById('studioRawText').value = data.text;
            label.innerHTML = '<i class="fas fa-check-circle me-1" style="color:#22c55e;"></i>' + file.name;
            showToast('PDF text extracted! Click "Auto-Fill" to enhance with AI.', 'success');
        } else {
            showToast(data.error || 'Could not extract text.', 'danger');
            label.textContent = 'Upload your existing PDF resume';
        }
    })
    .catch(() => {
        showToast('Failed to parse PDF.', 'danger');
        label.textContent = 'Upload your existing PDF resume';
    });
}

// ── PDF Download (html2pdf.js WYSIWYG) ───────────────────────
function studioDownloadPdf() {
    const paper = document.getElementById('a4Paper');
    const btn = document.getElementById('studioDownloadBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Building PDF...';

    paper.querySelectorAll('[contenteditable]').forEach(el => el.blur());

    const opt = {
        margin: 0,
        filename: 'CVAI_Resume_' + RS._currentTpl + '.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: {
            scale: 2,
            useCORS: true,
            letterRendering: true,
            scrollY: 0,
            windowWidth: paper.scrollWidth,
            windowHeight: paper.scrollHeight
        },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    html2pdf().set(opt).from(paper).save()
        .then(() => {
            showToast('PDF downloaded successfully!', 'success');
        })
        .catch(() => {
            showToast('PDF generation failed. Please try again.', 'danger');
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-download me-2"></i>Download PDF';
        });
}

// ── Canvas inline edit → state sync ──────────────────────────
document.addEventListener('input', function(e) {
    const el = e.target;
    if (!el.closest || !el.closest('#a4Paper')) return;

    const field = el.dataset.field;
    if (field && field in RS) {
        RS[field] = el.textContent;
        syncQuickEdit();
        return;
    }

    if (el.dataset.exp !== undefined) {
        const idx = parseInt(el.dataset.exp);
        if (el.dataset.bullet !== undefined) {
            const bi = parseInt(el.dataset.bullet);
            if (RS.experience[idx] && RS.experience[idx].bullets) {
                RS.experience[idx].bullets[bi] = el.textContent;
            }
        } else if (el.dataset.key) {
            if (RS.experience[idx]) {
                RS.experience[idx][el.dataset.key] = el.textContent;
            }
        }
    }
});

// ── Drag & Drop enhancement for upload zone ──────────────────
(function() {
    const zone = document.getElementById('studioPdfZone');
    if (!zone) return;
    ['dragenter', 'dragover'].forEach(ev => {
        zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add('dragover'); });
    });
    ['dragleave', 'drop'].forEach(ev => {
        zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('dragover'); });
    });
})();

// ═══════════════════════════════════════════════════════════════
// DESIGN CUSTOMIZATION ENGINE
// ═══════════════════════════════════════════════════════════════

// Per-template default color maps (primary, secondary)
const TPL_DEFAULTS = {
    'tpl-classic-navy':       { primary: '#4cc9f0', secondary: '#2c3e50' },
    'tpl-modern-minimalist':  { primary: '#667eea', secondary: '#1a1a2e' },
    'tpl-tech-startup':       { primary: '#39d353', secondary: '#0d1117' },
    'tpl-executive':          { primary: '#d4a853', secondary: '#1c1917' },
    'tpl-creative':           { primary: '#ff6b6b', secondary: '#1a1a2e' },
};

// ── Panel collapse toggle ────────────────────────────────────
function toggleDesignPanel() {
    const body = document.getElementById('designPanelBody');
    const chev = document.getElementById('designChevron');
    body.classList.toggle('collapsed');
    chev.classList.toggle('rotated');
}

// ── Color Picker → Canvas ────────────────────────────────────
function applyDesignColor(role, hex) {
    const paper = document.getElementById('a4Paper');
    if (role === 'primary') {
        document.getElementById('dcPrimaryHex').value = hex;
        document.getElementById('dcPrimaryColor').value = hex;
        _injectColor(paper, 'primary', hex);
    } else {
        document.getElementById('dcSecondaryHex').value = hex;
        document.getElementById('dcSecondaryColor').value = hex;
        _injectColor(paper, 'secondary', hex);
    }
}

function applyDesignColorHex(role, raw) {
    let hex = raw.trim();
    if (!hex.startsWith('#')) hex = '#' + hex;
    if (/^#[0-9a-fA-F]{6}$/.test(hex)) {
        applyDesignColor(role, hex);
    }
}

function applyPalette(primary, secondary) {
    applyDesignColor('primary', primary);
    applyDesignColor('secondary', secondary);
    showToast('Palette applied!', 'success');
}

// Inject accent colors into the live A4 paper via CSS custom properties
// This uses inline style overrides so it doesn't destroy existing template classes
function _injectColor(paper, role, hex) {
    const tpl = RS._currentTpl;

    // Build a dynamic <style> tag scoped to the paper
    let styleEl = document.getElementById('dcDynamicStyle');
    if (!styleEl) {
        styleEl = document.createElement('style');
        styleEl.id = 'dcDynamicStyle';
        document.head.appendChild(styleEl);
    }

    // Update the stored custom colors
    if (!window._dcColors) {
        const defaults = TPL_DEFAULTS[tpl] || TPL_DEFAULTS['tpl-classic-navy'];
        window._dcColors = { primary: defaults.primary, secondary: defaults.secondary };
    }
    window._dcColors[role] = hex;

    const p = window._dcColors.primary;
    const s = window._dcColors.secondary;

    // Generate CSS overrides for the active template
    styleEl.textContent = _buildColorCSS(tpl, p, s);
}

function _buildColorCSS(tpl, primary, secondary) {
    const sel = '.' + tpl;
    let css = '';

    if (tpl === 'tpl-classic-navy') {
        css = `
            ${sel} .cv-sidebar { background: ${secondary} !important; }
            ${sel} .cv-name { color: ${secondary} !important; }
            ${sel} .cv-role { color: ${primary} !important; }
            ${sel} .cv-section-title { color: ${primary} !important; }
            ${sel} .cv-sidebar .cv-contact-label { color: ${primary} !important; }
            ${sel} .cv-exp-company { color: ${primary} !important; }
            ${sel} .cv-exp-bullet::before { color: ${primary} !important; }
            ${sel} .cv-skill-fill { background: ${primary} !important; }
            ${sel} .cv-divider { background: ${primary}33 !important; }
        `;
    } else if (tpl === 'tpl-modern-minimalist') {
        css = `
            ${sel} .cv-role { color: ${primary} !important; }
            ${sel} .cv-section-title { color: ${primary} !important; }
            ${sel} .cv-section-title::after { background: ${primary} !important; }
            ${sel} .cv-exp-company { color: ${primary} !important; }
            ${sel} .cv-exp-bullet::before { color: ${primary} !important; }
            ${sel} .cv-skills-inline span { color: ${secondary} !important; }
        `;
    } else if (tpl === 'tpl-tech-startup') {
        css = `
            ${sel}.a4-paper { background: ${secondary} !important; }
            ${sel} .cv-accent-bar { background: ${primary} !important; }
            ${sel} .cv-name { color: ${primary} !important; }
            ${sel} .cv-section-title { color: ${primary} !important; }
            ${sel} .cv-divider { background: ${primary} !important; }
            ${sel} .cv-exp-bullet::before { color: ${primary} !important; }
            ${sel} .cv-skill-fill { background: ${primary} !important; }
        `;
    } else if (tpl === 'tpl-executive') {
        css = `
            ${sel} .cv-role { color: ${primary} !important; }
            ${sel} .cv-section-title { color: ${primary} !important; }
            ${sel} .cv-divider { background: ${primary} !important; }
            ${sel} .cv-section-divider { background: ${primary} !important; }
            ${sel} .cv-exp-company { color: ${primary} !important; }
            ${sel} .cv-exp-bullet::before { color: ${primary} !important; }
        `;
    } else if (tpl === 'tpl-creative') {
        css = `
            ${sel} .cv-header-band { background: ${secondary} !important; }
            ${sel} .cv-header-band::before { background: ${primary} !important; }
            ${sel} .cv-role { color: ${primary}cc !important; }
            ${sel} .cv-section-title { color: ${primary} !important; }
            ${sel} .cv-divider { background: ${primary}44 !important; }
            ${sel} .cv-accent-bar-bottom { background: ${primary} !important; }
            ${sel} .cv-exp-company { color: ${primary} !important; }
            ${sel} .cv-exp-bullet::before { color: ${primary}cc !important; }
            ${sel} .cv-skill-fill { background: ${primary} !important; }
        `;
    }

    return css;
}

// ── Typography Font Switcher ─────────────────────────────────
function applyDesignFont(fontStack) {
    const paper = document.getElementById('a4Paper');
    paper.style.fontFamily = fontStack;
    // Also apply to name + section titles for consistency
    paper.querySelectorAll('.cv-name, .cv-role, .cv-section-title, .cv-body-text, .cv-exp-title, .cv-exp-company, .cv-exp-bullet').forEach(el => {
        el.style.fontFamily = fontStack;
    });
}

// ── Layout Sliders ───────────────────────────────────────────
function applyDesignSlider(type, val) {
    const paper = document.getElementById('a4Paper');
    const v = parseFloat(val);

    if (type === 'fontSize') {
        paper.style.fontSize = v + 'pt';
        document.getElementById('dcFontSizeVal').textContent = v + 'pt';
    } else if (type === 'lineSpacing') {
        paper.style.lineHeight = v;
        document.getElementById('dcLineSpacingVal').textContent = v.toFixed(2);
    } else if (type === 'sectionMargin') {
        document.getElementById('dcSectionMarginVal').textContent = Math.round(v) + 'px';
        // Apply to all section titles as margin-top
        paper.querySelectorAll('.cv-section-title').forEach(el => {
            el.style.marginTop = v + 'px';
            el.style.marginBottom = Math.max(4, v * 0.45) + 'px';
        });
    }
}

// ── Reset to Template Defaults ───────────────────────────────
function resetDesignDefaults() {
    const paper = document.getElementById('a4Paper');
    const tpl = RS._currentTpl;
    const defaults = TPL_DEFAULTS[tpl] || TPL_DEFAULTS['tpl-classic-navy'];

    // Reset colors
    window._dcColors = { primary: defaults.primary, secondary: defaults.secondary };
    document.getElementById('dcPrimaryColor').value = defaults.primary;
    document.getElementById('dcPrimaryHex').value = defaults.primary;
    document.getElementById('dcSecondaryColor').value = defaults.secondary;
    document.getElementById('dcSecondaryHex').value = defaults.secondary;

    // Remove dynamic color overrides
    const styleEl = document.getElementById('dcDynamicStyle');
    if (styleEl) styleEl.textContent = '';

    // Reset typography
    paper.style.fontFamily = '';
    paper.querySelectorAll('.cv-name, .cv-role, .cv-section-title, .cv-body-text, .cv-exp-title, .cv-exp-company, .cv-exp-bullet').forEach(el => {
        el.style.fontFamily = '';
    });
    document.getElementById('dcFontFamily').value = "'Segoe UI', system-ui, -apple-system, sans-serif";

    // Reset layout sliders
    paper.style.fontSize = '';
    paper.style.lineHeight = '';
    paper.querySelectorAll('.cv-section-title').forEach(el => {
        el.style.marginTop = '';
        el.style.marginBottom = '';
    });
    document.getElementById('dcFontSize').value = 10;
    document.getElementById('dcFontSizeVal').textContent = '10pt';
    document.getElementById('dcLineSpacing').value = 1.5;
    document.getElementById('dcLineSpacingVal').textContent = '1.50';
    document.getElementById('dcSectionMargin').value = 18;
    document.getElementById('dcSectionMarginVal').textContent = '18px';

    showToast('Design reset to template defaults.', 'success');
}

// PRO SIDEBAR HELPERS

// ── Font chip visual selector ─────────────────────────────────
function selectProFont(btn) {
    document.querySelectorAll('#proFontGrid .pro-font-chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    const fontStack = btn.dataset.font;
    applyDesignFont(fontStack);
    // Keep hidden select in sync
    const sel = document.getElementById('dcFontFamily');
    if (sel) sel.value = fontStack;
}

// ── Mobile drawer toggle ──────────────────────────────────────
function toggleProSidebar() {
    const sidebar = document.getElementById('proSidebar');
    if (!sidebar) return;

    // Ensure overlay exists
    let overlay = document.getElementById('proSidebarOverlay');
    if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'proSidebarOverlay';
        overlay.className = 'pro-sidebar-overlay';
        overlay.onclick = toggleProSidebar;
        document.body.appendChild(overlay);
    }

    const isOpen = sidebar.classList.toggle('open');
    overlay.classList.toggle('active', isOpen);
    document.body.style.overflow = isOpen ? 'hidden' : '';
}

// ── Sync color pickers when template changes ─────────────────
const _origSwitchTpl = switchTpl;
switchTpl = function(btn) {
    _origSwitchTpl(btn);
    // After template switch, update color pickers to new template defaults
    const tpl = btn.dataset.tpl;
    const defaults = TPL_DEFAULTS[tpl] || TPL_DEFAULTS['tpl-classic-navy'];
    window._dcColors = { primary: defaults.primary, secondary: defaults.secondary };
    document.getElementById('dcPrimaryColor').value = defaults.primary;
    document.getElementById('dcPrimaryHex').value = defaults.primary;
    document.getElementById('dcSecondaryColor').value = defaults.secondary;
    document.getElementById('dcSecondaryHex').value = defaults.secondary;
    // Clear any previous dynamic overrides
    const styleEl = document.getElementById('dcDynamicStyle');
    if (styleEl) styleEl.textContent = '';
};
